# ───────────────────────────────────────────────
#  FingerCheck 設定ファイル
# ───────────────────────────────────────────────

# enabled: ルールを有効にするかどうか。編集後 /fingercheck reload で反映されます。
enabled: true

# ── ルール 1: 走っていないと動けない ──
# 前進キー（W）を押しているのに走っていない状態が threshold-seconds 秒続くと注意し、
# W を離して押し直すか、走る（またはスニークする）まで動けなくします。
# 次の場合は対象外です:
#   - スニーク（ゆっくり歩き）中
#   - 飛行中・エリトラ滑空中・乗り物に乗っている・水中/溶岩・はしご等
#   - そもそも走れない状況（満腹度 6 以下・盲目・食事や弓を引くなどアイテム使用中）
#   - クリエイティブ / スペクテイター
#   - 走るキーを押している（壁に当たってダッシュが切れた場合など）

# threshold-seconds: 何秒走らずに歩いたら注意するか（0.5〜60）。
threshold-seconds: 2.0

# display: 注意の表示先。actionbar（画面中央下）/ chat / both。
#          actionbar は歩き続けている間ずっと表示、chat は 1 回ごとに 1 行。
display: actionbar

# block-movement: 注意と同時にその場から動けなくするか。false なら注意だけ。
block-movement: true

# message: 注意のメッセージ。
message: "Shift も押してね！"
